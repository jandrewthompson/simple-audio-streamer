# Cache policy for the small text assets. Audio is handled separately in
# /data/ because a location-level add_header would suppress the security
# headers below. An empty value sends no Cache-Control at all.
map $uri $cache_control {
    default                              "";
    ~^/assets/                           "max-age=3600";
    ~^/(playlist\.json|index\.html)$     "no-cache";
}

server {
    listen 80;
    server_name _;

    root /srv/site;
    index index.html;

    server_tokens off;
    charset utf-8;
    default_type application/octet-stream;
    client_max_body_size 1m;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; media-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Audio: nginx serves Range requests (206/416, Accept-Ranges) natively.
    # `types` is repeated because a location-level `types` replaces the
    # inherited map rather than extending it, and the stock image does not
    # know flac/wav/oga/opus/m4b/aac.
    #
    # Only cache a plain, full-file GET. Range responses (including the
    # 416 for an unsatisfiable range) get no explicit lifetime, so a bad
    # range can never be pinned for a year. nginx evaluates headers before
    # the range filter sets 416, hence the request-header test.
    location /data/ {
        alias /srv/data/;
        if ($http_range = "") {
            expires 1y;
        }
        types {
            audio/mpeg mp3;
            audio/mp4  m4a m4b;
            audio/aac  aac;
            audio/ogg  ogg oga opus;
            audio/flac flac;
            audio/wav  wav;
            audio/webm webm;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
