<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d0b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Listen to Christmas 2026 by EWO.">
  <title>Christmas 2026 — EWO</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#playlist">Skip to playlist</a>

  <main class="page">
    <div id="app" aria-busy="true">
      <p class="status" role="status">Loading playlist…</p>
    </div>

    <p class="notice" id="notice" role="status" hidden></p>

    <noscript>
      <div class="status">
        <p>This player needs JavaScript to build the playlist.</p>
        <p>The playlist data is available at <a href="playlist.json">playlist.json</a>.</p>
      </div>
    </noscript>
  </main>

  <footer class="player" id="player" hidden>
    <div class="player__inner">
      <div class="player__now">
        <p class="player__label">Now playing</p>
        <p class="player__title" id="np-title">Nothing selected</p>
        <p class="player__artist" id="np-artist"></p>
      </div>

      <audio id="audio" controls preload="metadata" aria-label="Audio player"></audio>

      <div class="player__controls" role="group" aria-label="Playback options">
        <button type="button" class="control control--icon" id="prev" aria-label="Previous track" title="Previous track (P)">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 20 9 12l10-8v16Z"></path>
            <path d="M5 4v16"></path>
          </svg>
        </button>

        <button type="button" class="control control--icon" id="next" aria-label="Next track" title="Next track (N)">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 4l10 8-10 8V4Z"></path>
            <path d="M19 4v16"></path>
          </svg>
        </button>

        <button type="button" class="control" id="shuffle" aria-pressed="false" aria-label="Shuffle: off" title="Shuffle (S)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3h5v5"></path>
            <path d="M4 20 21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15l6 6"></path>
            <path d="M4 4l5 5"></path>
          </svg>
          <span class="control__label">Shuffle</span>
        </button>

        <button type="button" class="control" id="repeat" aria-pressed="false" aria-label="Repeat: off" title="Repeat (R)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 2l4 4-4 4"></path>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <path d="M7 22l-4-4 4-4"></path>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span class="control__label" id="repeat-label">Repeat</span>
        </button>
      </div>
    </div>
  </footer>

  <div class="visually-hidden" id="announcer" aria-live="polite"></div>
</body>
</html>
